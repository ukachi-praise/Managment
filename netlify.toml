[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PUPPETEER_SKIP_DOWNLOAD = "true"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,GEMINI_API_KEY"

[functions]
  node_bundler = "esbuild"
  memory = 2048
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core", "puppeteer"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]

[[plugins]]
  package = "@netlify/plugin-nextjs"
